# 이 파일은 /etc/nginx/conf.d/proxy.conf 경로에 저장하면 됩니다.

server {
    # Nginx 서버의 80번 포트로 들어오는 모든 HTTP 요청을 수신합니다.
    listen 80;
    
    # 서버 이름 지정. _는 모든 호스트 이름에 응답하도록 합니다.
    # 실제 도메인을 사용한다면 여기에 도메인 이름을 넣어주세요. (예: server_name bastion.myproject.com;)
    server_name _; 

    # -----------------------------------------------------------------
    # 1. WAS 프록시 설정 (가장 중요한 부분)
    # -----------------------------------------------------------------
    location /cloudops/ {
        # 요청을 WAS 서버 (172.16.20.10)의 8080 포트로 전달합니다.
        # 주의: proxy_pass 경로에 /cloudops/를 붙이면, Nginx가 전달할 때
        #       클라이언트 요청 URI에서 /cloudops/를 제거하지 않고 함께 전달합니다.
        proxy_pass http://172.16.20.10:8080/cloudops/;
        
        # 클라이언트의 실제 정보를 WAS로 전달하여 WAS 로그가 정확하도록 합니다.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # 기타 프록시 연결 타임아웃 설정 (선택 사항)
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
    
    # -----------------------------------------------------------------
    # 2. 기타 요청 처리 (정적 파일 또는 기본 페이지)
    # -----------------------------------------------------------------
    # /cloudops/ 경로가 아닌 다른 요청 (예: / 나 /index.html)이 들어왔을 때
    # Nginx가 자체적으로 정적 파일을 서빙하도록 설정합니다.
    location / {
        root   /var/www/html;  # Nginx의 기본 루트 디렉토리
        index  index.html index.htm;
        # 다른 정적 파일이 없다면 Nginx 기본 페이지가 보입니다.
    }
    
    # -----------------------------------------------------------------
    # 3. 에러 페이지 설정
    # -----------------------------------------------------------------
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
