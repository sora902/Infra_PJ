<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CloudOps - sora & yuna :)</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;
            color: #333;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .card {
            background: white;
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 20px;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .tab {
            background: #f0f0f0;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .tab.active {
            background: #667eea;
            color: white;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        .form-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
        }

        .btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            width: 100%;
            margin-top: 10px;
        }

        .btn:hover {
            background: #5a6fd8;
        }

        .dashboard {
            display: none;
        }

        .dashboard.active {
            display: block;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
        }

        .stat-number {
            font-size: 2rem;
            font-weight: bold;
            color: #667eea;
        }

        .servers {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
        }

        .server-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #eee;
        }

        .server-item:last-child {
            border-bottom: none;
        }

        .status {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
        }

        .status.online {
            background: #d4edda;
            color: #155724;
        }

        .message {
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
            display: none;
        }

        .message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>☁️ CloudOps</h1>
        </div>

        <!-- 로그인/회원가입 폼 -->
        <div id="authCard" class="card">
            <div class="tabs">
                <button class="tab active" onclick="showTab('login')">로그인</button>
                <button class="tab" onclick="showTab('register')">회원가입</button>
            </div>

            <div id="message" class="message"></div>

            <!-- 로그인 폼 -->
            <div id="login" class="tab-content active">
                <form onsubmit="handleLogin(event)">
                    <div class="form-group">
                        <label>이메일</label>
                        <input type="email" id="loginEmail" required>
                    </div>
                    <div class="form-group">
                        <label>비밀번호</label>
                        <input type="password" id="loginPassword" required>
                    </div>
                    <button type="submit" class="btn">로그인</button>
                </form>
            </div>

            <!-- 회원가입 폼 -->
            <div id="register" class="tab-content">
                <form onsubmit="handleRegister(event)">
                    <div class="form-group">
                        <label>이름</label>
                        <input type="text" id="registerName" required>
                    </div>
                    <div class="form-group">
                        <label>이메일</label>
                        <input type="email" id="registerEmail" required>
                    </div>
                    <div class="form-group">
                        <label>전화번호</label>
                        <input type="tel" id="registerPhone" required>
                    </div>
                    <div class="form-group">
                        <label>비밀번호</label>
                        <input type="password" id="registerPassword" required>
                    </div>
                    <button type="submit" class="btn">회원가입</button>
                </form>
            </div>
        </div>

        <!-- 대시보드 -->
        <div id="dashboard" class="dashboard">
            <div class="card">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                    <h2>대시보드</h2>
                    <button onclick="logout()" style="background: #dc3545; color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer;">로그아웃</button>
                </div>

                <div class="stats">
                    <div class="stat-card">
                        <div class="stat-number">5</div>
                        <div>활성 서버</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-number">98%</div>
                        <div>가동률</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-number">2.1GB</div>
                        <div>트래픽</div>
                    </div>
                </div>

                <div class="servers">
                    <h3 style="margin-bottom: 15px;">서버 상태</h3>
                    <div class="server-item">
                        <span>Web Server (172.16.10.10)</span>
                        <span class="status online">온라인</span>
                    </div>
                    <div class="server-item">
                        <span>WAS Server (172.16.20.10)</span>
                        <span class="status online">온라인</span>
                    </div>
                    <div class="server-item">
                        <span>DB Server (172.16.30.10)</span>
                        <span class="status online">온라인</span>
                    </div>
                    <div class="server-item">
                        <span>Bastion (172.16.0.10)</span>
                        <span class="status online">온라인</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 탭 전환
        function showTab(tabName) {
            // 모든 탭 비활성화
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            
            // 선택된 탭 활성화
            event.target.classList.add('active');
            document.getElementById(tabName).classList.add('active');
            
            // 메시지 숨김
            hideMessage();
        }

        // 메시지 표시
        function showMessage(text, type) {
            const message = document.getElementById('message');
            message.textContent = text;
            message.className = `message ${type}`;
            message.style.display = 'block';
        }

        function hideMessage() {
            document.getElementById('message').style.display = 'none';
        }

        // 로그인 처리
        async function handleLogin(event) {
            event.preventDefault();
            
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    showMessage('로그인 성공!', 'success');
                    setTimeout(() => {
                        document.getElementById('authCard').style.display = 'none';
                        document.getElementById('dashboard').classList.add('active');
                    }, 1000);
                } else {
                    showMessage(data.message || '로그인 실패', 'error');
                }
            } catch (error) {
                showMessage('서버 연결 실패', 'error');
            }
        }

        // 회원가입 처리
        async function handleRegister(event) {
            event.preventDefault();
            
            const name = document.getElementById('registerName').value;
            const email = document.getElementById('registerEmail').value;
            const phone = document.getElementById('registerPhone').value;
            const password = document.getElementById('registerPassword').value;

            try {
                const response = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ name, email, phone, password })
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    showMessage('회원가입 완료! 로그인해주세요.', 'success');
                    setTimeout(() => {
                        showTab('login');
                    }, 1500);
                } else {
                    showMessage(data.message || '회원가입 실패', 'error');
                }
            } catch (error) {
                showMessage('서버 연결 실패', 'error');
            }
        }

        // 로그아웃
        function logout() {
            document.getElementById('dashboard').classList.remove('active');
            document.getElementById('authCard').style.display = 'block';
            
            // 폼 초기화
            document.querySelectorAll('input').forEach(input => input.value = '');
            hideMessage();
        }
    </script>
</body>
</html>
